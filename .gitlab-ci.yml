stages:
  - lint
  - build

# Lint the client.
lint-client:
  stage: lint
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run lint

# Lint the server. Runs in parallel with lint-client.
lint-server:
  stage: lint
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run lint

# Compile the server. Fails if the TypeScript doesn't type-check.
build-server:
  stage: build
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run build

# Compile the client. Fails if the TypeScript doesn't type-check.
build-client:
  stage: build
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run build

