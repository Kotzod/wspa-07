stages:
  - lint
  - build
  - test
  - e2e

# Lint the client.
lint-client:
  stage: lint
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run lint

# Lint the server. Runs in parallel with lint-client.
lint-server:
  stage: lint
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run lint

# Compile the server. Fails if the TypeScript doesn't type-check.
build-server:
  stage: build
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run build

# Compile the client. Fails if the TypeScript doesn't type-check.
build-client:
  stage: build
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run build

test-server:
  stage: test
  image: node:22
  services:
    - name: postgres:16
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    POSTGRES_DB: app_test_db
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_test_db
  script:
    - apt-get update && apt-get install -y postgresql-client
    - psql -h postgres -U app -d app_test_db -f db/init/001-schema.sql
    - cd server
    - npm ci
    - npm test

test-client:
  stage: test
  image: node:22
  script:
    - cd client
    - npm ci
    - npm test

test-e2e:
  stage: e2e
  # This image ships with browsers preinstalled — Playwright needs one.
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  services:
    - name: postgres:16
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    POSTGRES_DB: app_db
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_db
    # Point the E2E tests at the served client (Step 2 of last lesson's
    # design: the tests never change, only this URL does).
    E2E_BASE_URL: "http://localhost:4173"
  script:
    - apt-get update && apt-get install -y postgresql-client
    - psql -h postgres -U app -d app_db -f db/init/001-schema.sql
    # Start the server in the background against the database.
    - cd server && npm ci
    - npm run start:ci &
    # Build and serve the client in the background.
    - cd ../client && npm ci
    - npm run build
    - npx vite preview --port 4173 --host &
    # Give both a moment to come up, then run the browser tests.
    - sleep 5
    - npx playwright test