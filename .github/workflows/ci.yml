name: CI

# GitLab runs a pipeline on every push and every merge request.
# The GitHub equivalent is push + pull_request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- lint stage ----------
  lint-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  lint-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint

  # ---------- build stage ----------
  # GitLab stages are barriers: build starts only when *every* lint job passed.
  # GitHub has no stages, so we reproduce that with needs: on both lint jobs.
  build-client:
    needs: [lint-client, lint-server]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  build-server:
    needs: [lint-client, lint-server]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build

  # ---------- test stage ----------
  test-server:
    needs: [build-client, build-server]
    runs-on: ubuntu-latest

    # Job-level env: read by the tests (PG*) and by psql in the schema step.
    # The job runs directly on the runner (no container:), so the Postgres
    # service is reached through its mapped port on localhost, not at the
    # hostname "postgres" like in GitLab.
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: app
      PGPASSWORD: app_pw
      PGDATABASE: app_test_db

    services:
      postgres:
        image: postgres:16
        env:
          # Read by the postgres container on boot (same as GitLab).
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_pw
          POSTGRES_DB: app_test_db
        ports:
          - 5432:5432
        # GitLab waits for service ports on its own; GitHub does not,
        # so we tell it how to check that Postgres is ready.
        options: >-
          --health-cmd "pg_isready -U app -d app_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The service creates an empty database; load the real schema ourselves.
      # psql is preinstalled on ubuntu-latest, so no apt-get step is needed.
      - name: Load schema
        run: psql -f db/init/001-schema.sql

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: npm test