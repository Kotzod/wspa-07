services:
  server:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: app
      PGPASSWORD: app_pw
      PGDATABASE: app_db
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "8080:80"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pw
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 4s
      retries: 10
  adminer:
    image: adminer
    ports:
      - "8088:8080"

volumes:
  db_data: